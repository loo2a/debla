<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>تطبيق دبلة - مودة ورحمة للزواج الجاد</title>
    <meta name="description" content="تطبيق جاد وموثوق للتعارف وبناء الأسرة المستقرة مع نظام تحقق صارم لضمان خصوصية وجدية المستخدمين." />
    <meta name="theme-color" content="#065f46" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="تطبيق دبلة - مودة ورحمة للزواج الجاد" />
    <meta property="og:description" content="تطبيق جاد وموثوق للتعارف وبناء الأسرة المستقرة مع نظام تحقق صارم لضمان خصوصية وجدية المستخدمين." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:linear-gradient(to bottom, #064e3b, #065f46, #047857);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;color:#ffffff;text-align:center;padding:24px;user-select:none;">
        <div style="width:112px;height:112px;border-radius:28px;background:rgba(6,78,59,0.8);border:2px solid rgba(254,240,138,0.5);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);margin-bottom:20px;overflow:hidden;">
          <img src="/icon-192.png" alt="مودة ورحمة" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='/icon.svg'" />
        </div>
        <h1 style="font-size:28px;font-weight:900;margin:0 0 6px 0;letter-spacing:-0.5px;color:#ffffff;">مَوَدَّةٌ وَرَحْمَة</h1>
        <p style="font-size:14px;color:#a7f3d0;margin:0 0 24px 0;font-weight:500;">المنصة الموثوقة للزواج الجاد وبناء الأسرة</p>
        <div style="width:28px;height:28px;border:3px solid rgba(254,240,138,0.3);border-top-color:#fef08a;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
